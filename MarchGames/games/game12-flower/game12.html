<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Grow a Flower - Game 12</title>
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="game12.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-wrapper">
        <a href="../../index.html" class="back-link">← Меню</a>
        <h1>Grow a Flower</h1>
        <h2 id="instruction">Посади насіння в горщик 🌰</h2>

        <div class="garden-bed">
            <div id="flowerPot" class="pot-area">
                <div id="flowerState" class="flower-stage">🪴</div>
            </div>
        </div>

        <div class="toolbox" id="toolbox">
            <div class="tool-item" id="toolSeed" data-step="1">🌰</div>
            <div class="tool-item disabled" id="toolWater" data-step="2">💧</div>
            <div class="tool-item disabled" id="toolSun" data-step="3">☀️</div>
        </div>

        <div class="progress-message" id="progressMessage">Крок: 1 / 3</div>
    </div>

    <script src="../../audio-manager.js"></script>
    <script src="../../victory.js"></script>
    <script src="game12.js"></script>
</body>
</html>
