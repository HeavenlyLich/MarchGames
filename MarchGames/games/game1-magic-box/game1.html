<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Box Sorter - March</title>
    
    <link rel="stylesheet" href="game1.css">

    <link rel="stylesheet" href="../../common.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="game-wrapper">
        <a href="../../index.html" class="back-link">← Меню</a>

        <header>
            <h1>Match the Shapes!</h1>
            <p>Перетягни фігури у правильні коробки</p>
        </header>

        <div class="shapes-container" id="shapesArea"></div>

        <div class="boxes-container">
            <div class="box" data-target="circle">
                <span class="label">Circle</span>
            </div>
            <div class="box" data-target="square">
                <span class="label">Square</span>
            </div>
            <div class="box" data-target="triangle">
                <span class="label">Triangle</span>
            </div>
        </div>
    </div>

    <script src="../../victory.js"></script>
    
    <script src="../../audio-manager.js"></script>

    <script src="game1.js"></script>

</body>
</html>
